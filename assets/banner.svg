<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="printerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .sub-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .invoice-text {
      font-family: monospace;
      font-size: 11px;
      fill: #64748b;
    }

    /* Subtle Dynamic Floating Keyframe Animations */
    @keyframes floatDoc {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes pulseBeam {
      0%, 100% { opacity: 0.25; stroke-dashoffset: 0; }
      50% { opacity: 0.85; stroke-dashoffset: -40; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { opacity: 1; }
      100% { transform: translateY(140px); opacity: 0.3; }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.15; }
      50% { transform: scale(1.15); opacity: 0.35; }
    }

    .animated-doc {
      animation: floatDoc 6s ease-in-out infinite;
      transform-origin: center;
    }
    .animated-beam {
      stroke-dasharray: 8 6;
      animation: pulseBeam 4s linear infinite;
    }
    .animated-scanner {
      animation: scanLine 3.5s ease-in-out infinite alternate;
    }
    .animated-orb {
      animation: pulseOrb 5s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1196" height="416" x="2" y="2" fill="none" stroke="#1e293b" stroke-width="2" rx="15" />

  <!-- Grid Pattern Overlay in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Light Orbs (Background layer) -->
  <circle class="animated-orb" cx="1020" cy="180" r="160" fill="#3b82f6" filter="url(#glow)" />
  <circle class="animated-orb" cx="820" cy="320" r="120" fill="#8b5cf6" filter="url(#glow)" />

  <!-- Dotted Connection Lines -->
  <path class="animated-beam" d="M 620 220 C 720 180, 780 260, 880 210" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path class="animated-beam" d="M 680 270 C 780 240, 840 330, 960 280" fill="none" stroke="#a855f7" stroke-width="2" />

  <!-- DYNAMIC RIGHT GRAPHIC: Realistic Floating Invoice Document & Printer Engine -->
  <g class="animated-doc" transform="translate(860, 50)">
    <!-- Shadow -->
    <rect x="15" y="25" width="240" height="310" rx="12" fill="#000000" opacity="0.45" filter="url(#glow)" />

    <!-- Sheet of Invoice Paper -->
    <rect x="0" y="10" width="240" height="300" rx="10" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Invoice Header Bar -->
    <rect x="0" y="10" width="240" height="42" rx="10" fill="#0f172a" />
    <circle cx="24" cy="31" r="7" fill="#38bdf8" />
    <rect x="40" y="27" width="70" height="8" rx="4" fill="#94a3b8" />
    <rect x="180" y="26" width="40" height="10" rx="3" fill="#22c55e" opacity="0.9" />

    <!-- Invoice Content Simulation Lines -->
    <rect x="24" y="70" width="110" height="10" rx="3" fill="#0284c7" />
    <rect x="24" y="90" width="70" height="6" rx="3" fill="#94a3b8" />
    <rect x="24" y="102" width="90" height="6" rx="3" fill="#cbd5e1" />

    <!-- Line Items Table -->
    <rect x="20" y="125" width="200" height="1" fill="#e2e8f0" />
    <rect x="24" y="138" width="80" height="6" rx="3" fill="#475569" />
    <rect x="175" y="138" width="40" height="6" rx="3" fill="#0f172a" />

    <rect x="24" y="156" width="95" height="6" rx="3" fill="#64748b" />
    <rect x="180" y="156" width="35" height="6" rx="3" fill="#0f172a" />

    <rect x="24" y="174" width="70" height="6" rx="3" fill="#64748b" />
    <rect x="185" y="174" width="30" height="6" rx="3" fill="#0f172a" />
    <rect x="20" y="194" width="200" height="1" fill="#e2e8f0" />

    <!-- Total Due Pill -->
    <rect x="135" y="210" width="85" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <rect x="145" y="220" width="65" height="7" rx="3" fill="#0284c7" />

    <!-- Simulated Barcode / QR Code Block -->
    <g transform="translate(24, 252)">
      <!-- Mini QR representation -->
      <rect x="0" y="0" width="36" height="36" rx="3" fill="#0f172a" />
      <rect x="4" y="4" width="10" height="10" fill="#ffffff" />
      <rect x="22" y="4" width="10" height="10" fill="#ffffff" />
      <rect x="4" y="22" width="10" height="10" fill="#ffffff" />
      <rect x="7" y="7" width="4" height="4" fill="#0f172a" />
      <rect x="25" y="7" width="4" height="4" fill="#0f172a" />
      <rect x="7" y="25" width="4" height="4" fill="#0f172a" />
      <!-- Barcode Bars -->
      <g transform="translate(50, 10)">
        <rect x="0" y="0" width="3" height="22" fill="#334155" />
        <rect x="5" y="0" width="2" height="22" fill="#334155" />
        <rect x="9" y="0" width="4" height="22" fill="#334155" />
        <rect x="15" y="0" width="1" height="22" fill="#334155" />
        <rect x="18" y="0" width="3" height="22" fill="#334155" />
        <rect x="24" y="0" width="5" height="22" fill="#334155" />
        <rect x="32" y="0" width="2" height="22" fill="#334155" />
        <rect x="36" y="0" width="4" height="22" fill="#334155" />
        <rect x="43" y="0" width="2" height="22" fill="#334155" />
        <rect x="48" y="0" width="5" height="22" fill="#334155" />
        <rect x="56" y="0" width="2" height="22" fill="#334155" />
      </g>
    </g>

    <!-- Glowing Scan Line across the Invoice -->
    <line class="animated-scanner" x1="10" y1="65" x2="230" y2="65" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)" />
  </g>

  <!-- FOREGROUND LEFT: Title, Subtitle, Highlights & Badges -->
  <!-- Top Category Chip -->
  <g transform="translate(80, 68)">
    <rect width="265" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" class="badge-text">⚡ ENTERPRISE &amp; OPEN SOURCE</text>
  </g>

  <!-- Foreground Title -->
  <text x="80" y="152" class="title-text">
    Awesome Document &amp;
  </text>
  <text x="80" y="206" class="title-text">
    <tspan fill="url(#accentCyan)">Invoice Printing</tspan>
  </text>

  <!-- Foreground Subtitle -->
  <text x="80" y="254" class="sub-text">
    Curated SaaS solutions, cloud printing APIs, &amp; self-hosted open-source engines.
  </text>

  <!-- Feature Highlights / Pills Row -->
  <g transform="translate(80, 292)">
    <!-- Pill 1 -->
    <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🖨️ Cloud Printing</text>

    <!-- Pill 2 -->
    <rect x="147" width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="161" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📄 Tax &amp; e-Invoice</text>

    <!-- Pill 3 -->
    <rect x="294" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="308" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📦 Packing Slips</text>

    <!-- Pill 4 -->
    <rect x="451" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="465" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛡️ Self-Hosted</text>
  </g>

  <!-- Bottom Accent Strip -->
  <rect x="0" y="414" width="1200" height="6" fill="url(#accentCyan)" />
</svg>
