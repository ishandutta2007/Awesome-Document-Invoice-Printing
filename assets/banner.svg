<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="45%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#0f1f3d" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a47" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0c1626" stop-opacity="0.85" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters for Glow & Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="printerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" fill-opacity="0.18" />
    </pattern>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-9px) rotate(1.2deg); }
    }

    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-1.5deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.06); }
    }

    @keyframes printPaperFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pillPulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.025); }
    }

    @keyframes beamScan {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(70px); opacity: 0.1; }
    }

    .anim-float1 { animation: floatSlow 7s ease-in-out infinite; }
    .anim-float2 { animation: floatReverse 8s ease-in-out infinite; }
    .anim-pulse { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
    .anim-pill { animation: pillPulse 4s ease-in-out infinite; transform-origin: center; }
    .anim-scan { animation: beamScan 3s ease-in-out infinite alternate; }

    .glow-orb-cyan { animation: pulseGlow 6s ease-in-out infinite; }
    .glow-orb-purple { animation: pulseGlow 7s ease-in-out infinite 1.5s; }

    /* Typography */
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16.5px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }

    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      letter-spacing: 0.8px;
    }

    .mono-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
    }
  </style>

  <!-- Deep High-Tech Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle cx="180" cy="110" r="140" fill="#0284c7" opacity="0.25" filter="url(#softGlow)" class="glow-orb-cyan" />
  <circle cx="1020" cy="280" r="160" fill="#7c3aed" opacity="0.22" filter="url(#softGlow)" class="glow-orb-purple" />
  <circle cx="820" cy="90" r="120" fill="#059669" opacity="0.18" filter="url(#softGlow)" class="glow-orb-cyan" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" rx="20" fill="url(#grid)" />

  <!-- Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="19.5" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- DYNAMIC BACKGROUND GRAPHICS (Right Side): Isometric Printer & Automated Document Engine -->
  <g transform="translate(805, 55)">
    <!-- Ambient Base Glow -->
    <ellipse cx="170" cy="275" rx="140" ry="24" fill="#0284c7" opacity="0.3" filter="url(#softGlow)" />

    <!-- Animated Document 1 (Processed Invoice) floating in background -->
    <g class="anim-float1" transform="translate(195, 30)">
      <rect x="0" y="0" width="135" height="175" rx="9" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#printerShadow)" />
      <!-- Header bar -->
      <rect x="12" y="14" width="48" height="6" rx="3" fill="#38bdf8" />
      <rect x="98" y="14" width="24" height="6" rx="3" fill="#34d399" />
      <!-- Invoice lines -->
      <line x1="12" y1="36" x2="122" y2="36" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,2" />
      <rect x="12" y="48" width="70" height="4.5" rx="2" fill="#64748b" />
      <rect x="100" y="48" width="22" height="4.5" rx="2" fill="#64748b" />
      <rect x="12" y="62" width="60" height="4.5" rx="2" fill="#64748b" />
      <rect x="100" y="62" width="22" height="4.5" rx="2" fill="#64748b" />
      <rect x="12" y="76" width="78" height="4.5" rx="2" fill="#64748b" />
      <rect x="100" y="76" width="22" height="4.5" rx="2" fill="#64748b" />
      <!-- Total block -->
      <rect x="12" y="100" width="110" height="26" rx="5" fill="#0f172a" />
      <rect x="20" y="109" width="35" height="7" rx="3.5" fill="#94a3b8" />
      <rect x="85" y="108" width="30" height="9" rx="4.5" fill="#38bdf8" />
      <!-- Barcode -->
      <g transform="translate(14, 140)">
        <rect x="0" y="0" width="2.5" height="16" fill="#94a3b8" />
        <rect x="5" y="0" width="1.5" height="16" fill="#94a3b8" />
        <rect x="9" y="0" width="3.5" height="16" fill="#94a3b8" />
        <rect x="15" y="0" width="1.5" height="16" fill="#94a3b8" />
        <rect x="19" y="0" width="4.5" height="16" fill="#94a3b8" />
        <rect x="26" y="0" width="2" height="16" fill="#94a3b8" />
        <rect x="31" y="0" width="3" height="16" fill="#94a3b8" />
        <rect x="37" y="0" width="1.5" height="16" fill="#94a3b8" />
        <rect x="42" y="0" width="3" height="16" fill="#94a3b8" />
        <rect x="48" y="0" width="1" height="16" fill="#94a3b8" />
      </g>
      <!-- Stamp Paid -->
      <rect x="68" y="137" width="55" height="20" rx="4" fill="none" stroke="#10b981" stroke-width="1.5" transform="rotate(-7 95 147)" />
      <text x="77" y="151" fill="#34d399" font-family="system-ui" font-weight="800" font-size="9" letter-spacing="1.5" transform="rotate(-7 95 147)">PAID</text>
    </g>

    <!-- Modern High-Speed Printer Engine -->
    <g class="anim-float2" transform="translate(30, 85)">
      <!-- Main Printer Chassis -->
      <rect x="20" y="60" width="240" height="130" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2" />
      <rect x="22" y="62" width="236" height="50" rx="12" fill="#1e293b" />
      
      <!-- Top Paper Feed Slot & Incoming Paper -->
      <path d="M 60 60 L 60 20 C 60 16 64 12 68 12 L 212 12 C 216 12 220 16 220 20 L 220 60 Z" fill="#090d16" stroke="#334155" stroke-width="1.5" />
      <!-- Input Paper Stack -->
      <rect x="74" y="22" width="132" height="40" rx="4" fill="#f8fafc" opacity="0.9" />
      <rect x="78" y="18" width="124" height="40" rx="4" fill="#e2e8f0" opacity="0.6" />
      <rect x="88" y="30" width="50" height="4" rx="2" fill="#94a3b8" />
      <rect x="88" y="38" width="70" height="4" rx="2" fill="#cbd5e1" />

      <!-- Center Output Slot -->
      <rect x="45" y="105" width="190" height="12" rx="4" fill="#020617" stroke="#38bdf8" stroke-width="1" />

      <!-- Scanning/Printing Laser Beam Indicator -->
      <line x1="50" y1="111" x2="230" y2="111" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" class="anim-pulse" />

      <!-- Printed Output Sheet extending outward -->
      <g transform="translate(60, 114)">
        <path d="M 0 0 L 160 0 L 155 85 C 155 88 152 91 148 91 L 12 91 C 8 91 5 88 5 85 Z" fill="#ffffff" filter="url(#printerShadow)" />
        <rect x="18" y="12" width="55" height="5" rx="2.5" fill="#3b82f6" />
        <circle cx="138" cy="15" r="4.5" fill="#10b981" />
        
        <!-- Animated print lines -->
        <line x1="18" y1="28" x2="142" y2="28" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="140" class="anim-scan" />
        <line x1="18" y1="38" x2="110" y2="38" stroke="#94a3b8" stroke-width="2.5" />
        <line x1="18" y1="48" x2="135" y2="48" stroke="#cbd5e1" stroke-width="2.5" />
        <line x1="18" y1="58" x2="80" y2="58" stroke="#94a3b8" stroke-width="2.5" />
        <rect x="18" y="70" width="124" height="12" rx="3" fill="#f1f5f9" />
        <rect x="105" y="73" width="30" height="6" rx="3" fill="#6366f1" />
      </g>

      <!-- Status Display Panel on Printer -->
      <rect x="195" y="75" width="50" height="22" rx="5" fill="#020617" stroke="#0ea5e9" stroke-width="1" />
      <circle cx="205" cy="86" r="3.5" fill="#10b981" class="anim-pulse" />
      <text x="214" y="89" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">ONLINE</text>

      <!-- Front Panel LEDs & Controls -->
      <circle cx="45" cy="85" r="4" fill="#38bdf8" />
      <circle cx="58" cy="85" r="4" fill="#6366f1" />
      <circle cx="71" cy="85" r="4" fill="#10b981" />
      <line x1="88" y1="85" x2="175" y2="85" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Floating Mini Status Card: Cloud Dispatch -->
    <g class="anim-float1" transform="translate(10, 195)">
      <rect x="0" y="0" width="125" height="48" rx="8" fill="#111c33" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="24" r="9" fill="#4338ca" />
      <!-- Cloud Icon -->
      <path d="M 16 26 A 3.5 3.5 0 0 1 17 19.5 A 5 5 0 0 1 25.5 21 A 3.5 3.5 0 0 1 25 26 Z" fill="#ffffff" />
      <text x="35" y="20" fill="#f8fafc" font-family="system-ui" font-size="10" font-weight="700">Cloud Spool</text>
      <text x="35" y="33" fill="#34d399" font-family="system-ui" font-size="8.5" font-weight="600">● 99.98% Latency</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Subtitles, Badges (Left Anchored) -->
  <g transform="translate(70, 0)">
    
    <!-- Top Pill: Category / Status Indicator -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="265" height="32" rx="16" fill="url(#cyanGlow)" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8" class="anim-pulse" />
      <text x="29" y="20" fill="#e0f2fe" class="badge-text">ENTERPRISE FULFILLMENT &amp; PRINT</text>
    </g>

    <!-- Main Title (Prominent, High Contrast Foreground) -->
    <g transform="translate(0, 130)">
      <text class="title-text" fill="url(#titleGrad)">Awesome Document</text>
      <text x="0" y="52" class="title-text" fill="#ffffff">&amp; Invoice Printing</text>
    </g>

    <!-- Descriptive Subtitle -->
    <g transform="translate(0, 222)">
      <text class="subtitle-text">Curated directory of enterprise SaaS solutions, cloud printing APIs,</text>
      <text x="0" y="24" class="subtitle-text">automated warehouse fulfillment pipelines &amp; self-hosted open-source stacks.</text>
    </g>

    <!-- Interactive / Status Metrics Badges -->
    <g transform="translate(0, 285)">
      <!-- Badge 1: CUPS & IPP Cloud Ready -->
      <g class="anim-pill" transform="translate(0, 0)">
        <rect x="0" y="0" width="148" height="44" rx="10" fill="#0b172a" stroke="#0284c7" stroke-width="1.2" />
        <circle cx="20" cy="22" r="10" fill="#0369a1" />
        <path d="M 16 22 L 19 25 L 25 18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="38" y="19" fill="#94a3b8" class="mono-text" font-size="9.5">PROTOCOL</text>
        <text x="38" y="32" fill="#f8fafc" class="badge-text" font-size="11">CUPS • IPP • ESC/POS</text>
      </g>

      <!-- Badge 2: High Speed PDF Rendering -->
      <g class="anim-pill" transform="translate(162, 0)">
        <rect x="0" y="0" width="148" height="44" rx="10" fill="#0b172a" stroke="#818cf8" stroke-width="1.2" />
        <circle cx="20" cy="22" r="10" fill="#4338ca" />
        <!-- Lightning bolt -->
        <path d="M 21 16 L 16 23 L 20 23 L 19 28 L 24 21 L 20 21 Z" fill="#a5b4fc" />
        <text x="38" y="19" fill="#94a3b8" class="mono-text" font-size="9.5">PDF RENDERING</text>
        <text x="38" y="32" fill="#f8fafc" class="badge-text" font-size="11">Sub-second API</text>
      </g>

      <!-- Badge 3: Hardware Agnostic -->
      <g class="anim-pill" transform="translate(324, 0)">
        <rect x="0" y="0" width="165" height="44" rx="10" fill="#0b172a" stroke="#10b981" stroke-width="1.2" />
        <circle cx="20" cy="22" r="10" fill="#065f46" />
        <!-- Thermal Printer Icon -->
        <rect x="15" y="17" width="10" height="9" rx="1.5" fill="#34d399" />
        <line x1="17" y1="20" x2="23" y2="20" stroke="#064e3b" stroke-width="1.5" />
        <text x="38" y="19" fill="#94a3b8" class="mono-text" font-size="9.5">HARDWARE READY</text>
        <text x="38" y="32" fill="#f8fafc" class="badge-text" font-size="11">Thermal &amp; Laser Print</text>
      </g>

      <!-- Badge 4: Production Open Source -->
      <g class="anim-pill" transform="translate(503, 0)">
        <rect x="0" y="0" width="142" height="44" rx="10" fill="#0b172a" stroke="#f59e0b" stroke-width="1.2" />
        <circle cx="20" cy="22" r="10" fill="#92400e" />
        <!-- Star Icon -->
        <polygon points="20,15 22,19.5 27,20 23.5,23.5 24.5,28 20,25.5 15.5,28 16.5,23.5 13,20 18,19.5" fill="#fcd34d" />
        <text x="38" y="19" fill="#94a3b8" class="mono-text" font-size="9.5">ECOSYSTEM</text>
        <text x="38" y="32" fill="#f8fafc" class="badge-text" font-size="11">SaaS &amp; Self-Hosted</text>
      </g>
    </g>

    <!-- Bottom Tech Tags Row -->
    <g transform="translate(0, 360)">
      <text fill="#64748b" font-family="ui-monospace, monospace" font-size="11" letter-spacing="0.5">
        STACK: <tspan fill="#38bdf8">HTML-to-PDF</tspan> • <tspan fill="#818cf8">ZPL / EPL</tspan> • <tspan fill="#34d399">Cloud-Spooler</tspan> • <tspan fill="#fbbf24">REST / GraphQL</tspan> • <tspan fill="#f43f5e">Multi-Currency</tspan> • <tspan fill="#a855f7">E-Invoicing</tspan>
      </text>
    </g>
  </g>
</svg>
